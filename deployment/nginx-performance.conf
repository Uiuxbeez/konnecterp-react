# Merge into the existing HTTPS server block. Replace equivalent directives /
# locations rather than adding duplicates. Keep existing proxy and TLS settings.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript application/xml text/xml image/svg+xml;

# Vite content-hashed build assets can be cached for a year.
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Public images keep their filenames across deployments: use a shorter cache.
location ^~ /images/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

# Serve the frontend copies, not the React shell.
location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
}
location = /sitemap.html {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
}

# If already present, retain this existing SPA fallback.
# location / { try_files $uri $uri/ /index.html; }
# Do not apply immutable caching to /api, /uploads, or HTML.
