name: Deploy KonnectERP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: konnecterp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/konnecterp_deploy
          chmod 600 ~/.ssh/konnecterp_deploy

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/konnecterp_deploy \
            "$VPS_USER@$VPS_HOST" << 'DEPLOY'
              set -e

              cd /home/uiuxbeez/konnecterp-react

              git fetch origin main
              git reset --hard origin/main

              npm ci
              npm run build

              sudo rm -rf /var/www/konnecterp/*
              sudo cp -r dist/. /var/www/konnecterp/
              sudo chown -R www-data:www-data /var/www/konnecterp
              sudo chmod -R 755 /var/www/konnecterp

              pm2 restart konnecterp --update-env
              pm2 save

              sudo nginx -t
              sudo systemctl reload nginx
          DEPLOY
