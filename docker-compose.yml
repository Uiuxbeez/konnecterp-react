services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: konnect
      POSTGRES_PASSWORD: konnect
      POSTGRES_DB: konnecterp
    ports:
      - "5432:5432"
    volumes:
      - konnect_pgdata:/var/lib/postgresql/data

volumes:
  konnect_pgdata:
